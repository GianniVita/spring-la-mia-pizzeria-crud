<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">

<head>
    <div th:replace="~{fragments/resources :: headTags}"></div>
</head>

<body>
    <header>
        <nav th:replace="~{fragments/navbar :: navbar('pizzas')}"></nav>
    </header>

    <main class="container py-4">
        <div class="row">
            <div class="col-12">
                <th:block>
                    <h1 class="py-4 mb-2 text-center">
                        Updating [[${pizza.name}]]

                    </h1>
                    <div class="row justify-content-center">
                        <div class="col-8">
                            <form id="pizza-form" th:action="@{/pizzas/edit/{id}(id=${pizza.id})}" th:object="${pizza}"
                                method="post">
                                <div class="mb-3">
                                    <label class="form-label" for="title">Name:</label>
                                    <input class="form-control" type="text" id="title" th:field="*{name}"
                                        th:errorClass="is-invalid">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}">
                                        <ul>
                                            <li th:each="error : ${#fields.errors('name')}" th:text="${error}" />
                                        </ul>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="title">Price:</label>
                                    <input class="form-control" type="text" id="price" th:field="*{price}"
                                        th:errorClass="is-invalid">
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('price')}">
                                        <ul>
                                            <li th:each="error : ${#fields.errors('price')}" th:text="${error}" />
                                        </ul>
                                    </div>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label" for="description">Details:</label>
                                    <textarea id="description" class="form-control" th:field="*{description}"
                                        th:errorClass="is-invalid"></textarea>
                                    <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}">
                                        <ul>
                                            <li th:each="error : ${#fields.errors('description')}" th:text="${error}" />
                                        </ul>
                                    </div>
                                </div>


                                <div class="mb-3 d-flex justify-content-between">
                                    <input type="submit" class="btn btn-outline-primary" value="Save changes">
                                    <input type="reset" class="btn btn-outline-warning" value="Reset all fields">
                                </div>

                            </form>
                            <!-- Form -->
                        </div>
                    </div>
                </th:block>
            </div>
        </div>
    </main>
    <div th:replace="~{fragments/resources :: scripts}"></div>
</body>

</html>
