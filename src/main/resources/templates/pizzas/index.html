<!DOCTYPE html>
<html xmlns="http://thymeleaf.org">

<head>
    <div th:replace="~{fragments/resources :: headTags}"></div>
    <title>Pizzas</title>
</head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar('pizzas')}"></nav>
    <hr />
    <main class="container py-4">

        <div class="mb-3 d-flex">
            <a th:href="@{/pizzas/create}" class="me-auto btn btn-sm btn-outline-primary">
                <i class="fa-solid fa-circle-plus"></i> Create New Pizza
            </a>
        </div>


        <section class="row">
            <div class="col-12">
                <table class="table" th:if="${pizzas.size() > 0}">
                    <thead>
                        <tr>
                            <th>Number</th>
                            <th>Name</th>
                            <th>Price</th>
                            <th>Details</th>
                            <th></th>
                            <th></th>
                            <th></th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="pizza : ${pizzas}" th:object="${pizza}">
                            <td>[[*{id}]]</td>
                            <td>[[*{name}]]</td>
                            <td>[[*{price}]]</td>
                            <td>
                                <a th:href="@{/pizzas/{id}/specials(id=${pizza.id})}"
                                    class="btn btn-sm btn-outline-warning">
                                    <i class="fa-solid fa-gift"> Specials</i>
                                </a>
                            </td>
                            <td>
                                <a th:href="@{/pizzas/{id}(id=*{id})}" class="btn btn-sm btn-outline-secondary">
                                    <i class="fa-solid fa-pizza-slice"> Show</i>
                                </a>
                            </td>
                            <td>
                                <a th:href="@{/pizzas/edit/{id}(id=${pizza.id})}"
                                    class="btn btn-outline-success btn-sm">
                                    <i class="fa-regular fa-pen-to-square"> Edit</i>
                                </a>
                            </td>
                            <td>
                                <!-- bottone che fa partire la modale -->
                                <button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal"
                                    th:data-bs-target="'#delete-modal-' + ${pizza.id}"><i class="fa-solid fa-trash">
                                        Delete</i></button>
                                <!-- ##B:Modale che appare solo dopo il click sul relativo bottone di Delete -->
                                <div class="modal fade" th:id="'delete-modal-' + ${pizza.id}" tabindex="-1"
                                    aria-labelledby="delete-model" aria-hidden="true">
                                    <div class="modal-dialog modal-dialog modal-dialog-centered">
                                        <div class="modal-content">
                                            <div class="modal-header">
                                                <h1 class="modal-title fs-5" id="exampleModalLabel">
                                                    Deleting "[[${pizza.name}]]"
                                                </h1>
                                                <button type="button" class="btn-close" data-bs-dismiss="modal"
                                                    aria-label="Close"></button>
                                            </div>
                                            <div class="modal-body">
                                                Are you sure you want to delete a pizza named:
                                                <strong>"[[${pizza.name}]]"</strong>
                                            </div>
                                            <div class="modal-footer">
                                                <!-- bototone da cliccare senza la modale senza effetti -->
                                                <button type="button" class="btn btn-outline-secondary"
                                                    data-bs-dismiss="modal">Close</button>
                                                <!-- vero bottone della modale che fa partire la nostra  action di cancellazione chiamiamo il metodo delete   -->
                                                <form class="d-inline-block"
                                                    th:action="@{/pizzas/delete/{id}(id=${pizza.id})}" method="post">
                                                    <button type="submit" class="btn btn-outline-danger">
                                                        Delete
                                                    </button>
                                                </form>
                                            </div>
                                        </div>
                                    </div>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>

                <p th:unless="${pizzas.size() > 0}">No pizzas available at the moment... sorry.</p>

            </div>

        </section>
    </main>
    <div th:replace="~{fragments/resources :: scripts}"></div>
</body>

</html>
