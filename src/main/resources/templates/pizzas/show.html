<!DOCTYPE html>
<html xmlns:th="http://thymeleaf.org">

<head>
    <div th:replace="~{fragments/resources :: headTags}"></div>
    <title>Pizza : [[${pizza.name}]]</title>
</head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar('pizzas')}"></nav>
    <main class="container py-4" th:object="${pizza}">

        <hr />



        <section class="row">

            <div class="col-md-4">
                <img th:if="*{photo != null and !#strings.isEmpty(photo)}" th:src="*{photo}" th:alt="*{name}"
                    class="img-fluid rounded shadow" style="transform: translateY(10px);" />
                <div th:unless="*{photo != null and !#strings.isEmpty(photo)}"
                    class="bg-secondary text-white d-flex align-items-center justify-content-center rounded"
                    style="height: 300px;">
                    No photo
                </div>
            </div>

            <div class="col-md-8">
                <h1 class="fw-bold mb-3">[[*{name}]]</h1>
                <p class="lead mb-4">[[*{description}]]</p>
                <p class="fs-4 fw-semibold text-success">€ [[*{price}]]</p>
                <div class="mb-3">
                    <a th:href="@{/pizzas}" class="btn btn-outline-secondary">← Back to list</a>
                </div>
            </div>
        </section>

        <section class="row mb-3 specials">
            <div class="col-12">
                <div class="d-flex justify-content-between align-items-center mb-3">
                    <h2 class="h4 mb-0">Specials</h2>
                    <a th:href="@{/pizzas/{id}/specials(id=*{id})}" class="btn btn-sm btn-outline-warning">
                        <i class="fa-solid fa-gift"></i> Add Special
                    </a>
                </div>

                <table class="table" th:if="*{specials != null and !specials.isEmpty()}">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Start Date</th>
                            <th>End Date</th>
                            <th>Notes</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="special : *{specials}">
                            <td>[[${special.id}]]</td>
                            <td>[[${special.startSpecialDate}]]</td>
                            <td>[[${special.endOfSpecialDate}]]</td>
                            <td>[[${special.notes}]]</td>
                        </tr>
                    </tbody>
                </table>

                <p class="text-muted mb-0" th:if="*{specials == null or specials.isEmpty()}">No specials available for
                    this pizza.</p>
            </div>
        </section>

    </main>

    <div th:replace="~{fragments/resources :: scripts}"></div>
</body>

</html>
