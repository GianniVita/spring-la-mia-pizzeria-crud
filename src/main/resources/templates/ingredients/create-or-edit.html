<!DOCTYPE html>
<html xmlns="http://thymeleaf.org">

<head>
    <div th:replace="~{fragments/resources :: headTags}"></div>
    <title>Ingrediets</title>
</head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar('ingredients')}"></nav>
    <hr />
    <main class="container py-4">

        <div class="col-12">
            <th:block>
                <h1 th:if="${edit}" class="py-4 mb-2 text-center fw-bold">
                    Updating ingredient [[${ingredient.name}]]!
                </h1>
                <h1 th:unless="${edit}" class="py-4 mb-2 text-center fw-bold">
                    Creating new Ingredient
                </h1>
                <div class="row justify-content-center">
                    <div class="col-8">
                        <form id="ingredient-form"
                            th:action="${edit != null and edit} ? @{/ingredients/edit/{id}(id=${ingredient.id})} : @{/ingredients/create}"
                            th:object="${ingredient}" method="post">
        
                            <div class="mb-3">
                                <label class="form-label" for="name">Ingredient name:</label>
                                <input class="form-control" type="text" id="name" th:field="*{name}" placeholder="Flour"
                                    th:errorClass="is-invalid">
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('name')}">
                                    <ul>
                                        <li th:each="error : ${#fields.errors('name')}" th:text="${error}" />
                                    </ul>
                                </div>
                            </div>
                           
                            <div class="mb-3">
                                <label class="form-label" for="description">Description:</label>
                                <textarea id="description" class="form-control" th:field="*{description}"
                                    th:errorClass="is-invalid"></textarea>
                                <div class="invalid-feedback" th:if="${#fields.hasErrors('description')}">
                                    <ul>
                                        <li th:each="error : ${#fields.errors('description')}" th:text="${error}" />
                                    </ul>
                                </div>
                            </div>
        
        
                            <div class="mb-3 d-flex justify-content-between">
                                <input type="submit" class="btn btn-outline-primary"
                                    th:value="${edit != null and edit} ? 'Update Ingrediend' : 'Save'">
                                <input type="reset" class="btn btn-outline-warning" value="Reset all fields">
                            </div>
        
                        </form>
        
                    </div>
                </div>
            </th:block>
        </div>


    </main>
    <div th:replace="~{fragments/resources :: scripts}"></div>
</body>

</html>
