<!DOCTYPE html>
<html xmlns="http://thymeleaf.org">

<head>
    <div th:replace="~{fragments/resources :: headTags}"></div>
    <title>Ingrediets</title>
</head>

<body>
    <nav th:replace="~{fragments/navbar :: navbar('ingredients')}"></nav>
    <hr />
    <main class="container py-4" th:object="${ingredient}">
        <h1>Ingredient "[[*{name}]]"</h1>
        <hr />

        <section class="row">
          <div class="col-md-8">
                <h1 class="fw-bold mb-3">[[*{name}]]</h1>
                <p class="mb-4">Pizzas with this Ingredient:[[*{pizzas.size()}]]</p>
                <p th:text="${description}" />
            </div>
        </section>

    </main>
    <div th:replace="~{fragments/resources :: scripts}"></div>
</body>

</html>
